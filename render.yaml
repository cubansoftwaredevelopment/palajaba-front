services:
  - type: web
    name: palajaba-web
    runtime: static
    buildCommand: npm install && npm run build
    # Tras el build, dist/404.html permite /admin, /login, etc. al recargar o abrir URL directa.
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
